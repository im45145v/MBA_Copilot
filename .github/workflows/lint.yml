name: Code Quality

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Format & Project Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Check Formatting
        run: |
          if npm run | grep -q "format:check"; then
            npm run format:check
          elif npm run | grep -q "format"; then
            echo "Format script exists but no format:check. Skipping."
          else
            echo "No formatter configured."
          fi

      - name: TypeScript
        run: |
          if npm run | grep -q "type-check"; then
            npm run type-check
          elif npm run | grep -q "typecheck"; then
            npm run typecheck
          else
            echo "No type checking configured."
          fi

      - name: Verify Repository Standards
        run: |
          echo "Checking required GitHub Copilot resources..."

          REQUIRED=(
            ".github/copilot-instructions.md"

            ".github/instructions/business-analyst.instructions.md"
            ".github/instructions/frontend.instructions.md"
            ".github/instructions/python.instructions.md"
            ".github/instructions/report.instructions.md"

            ".github/skills/clean-business-data/skill.md"
            ".github/skills/executive-analysis/skill.md"
            ".github/skills/dashboard-review/skill.md"
            ".github/skills/executive-report/skill.md"
            ".github/skills/presentation-generator/skill.md"

            ".github/agents/executive-advisor.md"
            ".github/agents/financial-analyst.md"
            ".github/agents/marketing-strategist.md"
            ".github/agents/operations-consultant.md"
            ".github/agents/dashboard-designer.md"
            ".github/agents/frontend-engineer.md"
          )

          for file in "${REQUIRED[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              exit 1
            fi
          done

          echo "✅ Repository structure verified."

      - name: Check Markdown Files
        run: |
          echo "Checking markdown documentation..."

          find . -name "*.md" | while read file; do
            if [ ! -s "$file" ]; then
              echo "❌ Empty markdown file: $file"
              exit 1
            fi
          done

          echo "✅ Documentation looks good."

      - name: Summary
        run: |
          echo ""
          echo "----------------------------------------"
          echo " Repository Quality Checks Passed"
          echo "----------------------------------------"
          echo ""
          echo "✓ Lint"
          echo "✓ Type Checking"
          echo "✓ Repository Standards"
          echo "✓ Documentation"
          echo ""