name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Type Check
        run: npm run type-check

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

  python-validation:
    name: Python Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python Dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found."
          fi

      - name: Validate Python Files
        run: |
          python -m compileall .

  repository-validation:
    name: Validate Workshop Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Copilot Instructions
        run: |
          REQUIRED_FILES=(
            ".github/copilot-instructions.md"
            ".github/instructions/business-analyst.instructions.md"
            ".github/instructions/frontend.instructions.md"
            ".github/instructions/python.instructions.md"
            ".github/instructions/report.instructions.md"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing: $file"
              exit 1
            fi
          done

      - name: Validate Skills
        run: |
          REQUIRED_SKILLS=(
            ".github/skills/clean-business-data/skill.md"
            ".github/skills/executive-analysis/skill.md"
            ".github/skills/dashboard-review/skill.md"
            ".github/skills/executive-report/skill.md"
            ".github/skills/presentation-generator/skill.md"
          )

          for file in "${REQUIRED_SKILLS[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing Skill: $file"
              exit 1
            fi
          done

      - name: Validate Agents
        run: |
          REQUIRED_AGENTS=(
            ".github/agents/executive-advisor.md"
            ".github/agents/financial-analyst.md"
            ".github/agents/marketing-strategist.md"
            ".github/agents/operations-consultant.md"
            ".github/agents/dashboard-designer.md"
            ".github/agents/frontend-engineer.md"
          )

          for file in "${REQUIRED_AGENTS[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing Agent: $file"
              exit 1
            fi
          done

      - name: Success
      run: echo "Repository validation completed successfully."