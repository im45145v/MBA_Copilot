name: Deploy Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  verify:
    name: Verify Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Copilot Repository
        run: |
          REQUIRED=(
            ".github/copilot-instructions.md"

            ".github/instructions/business-analyst.instructions.md"
            ".github/instructions/frontend.instructions.md"
            ".github/instructions/python.instructions.md"
            ".github/instructions/report.instructions.md"

            ".github/skills/clean-business-data/skill.md"
            ".github/skills/executive-analysis/skill.md"
            ".github/skills/dashboard-review/skill.md"
            ".github/skills/executive-report/skill.md"
            ".github/skills/presentation-generator/skill.md"

            ".github/agents/executive-advisor.md"
            ".github/agents/financial-analyst.md"
            ".github/agents/marketing-strategist.md"
            ".github/agents/operations-consultant.md"
            ".github/agents/dashboard-designer.md"
            ".github/agents/frontend-engineer.md"
          )

          for file in "${REQUIRED[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

          echo "Repository validation complete."

  build:
    name: Build Application
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

  deploy-preview:
    name: Deployment Summary
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deployment Ready
        run: |
          echo ""
          echo "========================================"
          echo " Production Build Complete"
          echo "========================================"
          echo ""
          echo "The application has successfully:"
          echo ""
          echo "✓ Passed repository validation"
          echo "✓ Installed dependencies"
          echo "✓ Completed production build"
          echo ""
          echo "This repository is now ready for deployment."
          echo ""

      - name: Vercel Deployment
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"

      - name: Skip Deployment
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: |
          echo ""
          echo "No Vercel credentials found."
          echo "Skipping production deployment."
          echo ""
          echo "To enable deployment, configure:"
          echo "- VERCEL_TOKEN"
          echo "- VERCEL_ORG_ID"
          echo "- VERCEL_PROJECT_ID"